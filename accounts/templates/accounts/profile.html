{% extends "base.html" %}
{% block title %}Profile — Taazgi{% endblock %}
{% block content %}
<div class="auth-card">
  <h2 class="section-title">Profile</h2>
  <div class="card">
    <div class="row"><span class="muted">Name</span><b>{{ user.get_full_name|default:"—" }}</b></div>
    <div class="row" style="margin-top:8px;"><span class="muted">Mobile number</span><b>+91 {{ user.mobile }}</b></div>
    <div class="row" style="margin-top:8px;"><span class="muted">Referral code</span><b>{{ user.referral_code }}</b></div>
  </div>
  <button
    class="btn secondary full"
    type="button"
    id="share-referral"
    data-share-url="{{ request.scheme }}://{{ request.get_host }}{% url 'login' %}?ref={{ user.referral_code }}"
  >
    Share referral code
  </button>
  <p class="muted" id="share-status" role="status" aria-live="polite"></p>
</div>

<script>
  const shareButton = document.getElementById('share-referral');
  const shareStatus = document.getElementById('share-status');
  const shareUrl = shareButton.dataset.shareUrl;
  const shareText = `Join Taazgi with my referral code: {{ user.referral_code|escapejs }}`;

  shareButton.addEventListener('click', async () => {
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Join Taazgi', text: shareText, url: shareUrl });
        shareStatus.textContent = 'Referral link shared.';
      } else {
        await navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
        shareStatus.textContent = 'Referral link copied.';
      }
    } catch (error) {
      if (error.name !== 'AbortError') shareStatus.textContent = 'Unable to share right now.';
    }
  });
</script>
{% endblock %}
