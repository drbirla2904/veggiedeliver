{% extends "base.html" %}
{% block title %}Profile — Taazgi{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-hero" aria-hidden="true">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2c2.21 0 4 1.79 4 4 0 2.21-1.79 4-4 4s-4-1.79-4-4c0-2.21 1.79-4 4-4z" fill="var(--harvest)"/>
      <path d="M6 14c0 3.31 2.69 6 6 6s6-2.69 6-6c0-3.31-2.69-6-6-6S6 10.69 6 14z" fill="var(--leaf)"/>
    </svg>
  </div>
  <h2 class="section-title">Your profile</h2>
  <div class="auth-illustration-wrap">
    <img src="/static/img/auth-illustration.svg" alt="illustration" class="auth-illustration">
  </div>
  <div class="card">
    <div class="row"><span class="muted">Name</span><b>{{ user.get_full_name|default:"—" }}</b></div>
    <div class="row" style="margin-top:8px;"><span class="muted">Mobile</span><b>+91 {{ user.mobile }}</b></div>
    <div class="row" style="margin-top:8px;"><span class="muted">Referral code</span><b>{{ user.referral_code }}</b></div>
  </div>
  <a class="btn secondary full" href="{% url 'order_history' %}">Your orders</a>
  <div style="height:10px;"></div>
  <a class="btn secondary full" href="{% url 'wallet_page' %}">Wallet & referrals</a>
</div>
{% endblock %}
