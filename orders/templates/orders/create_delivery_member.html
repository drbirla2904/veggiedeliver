{% extends "base.html" %}
{% block title %}Add Delivery Member{% endblock %}
{% block content %}
<h2 class="section-title">Add a delivery member</h2>
<p class="muted" style="margin-bottom:18px;">They'll be able to log in and receive nearby order assignments once created.</p>

<div class="auth-card">
<form method="post">
  {% csrf_token %}
  <label>Name</label>
  <input type="text" name="first_name" placeholder="Full name" required>
  <label>Mobile number</label>
  <input type="tel" name="mobile" maxlength="10" placeholder="10-digit mobile number" required>
  <button class="btn full" type="submit" style="margin-top:20px;">Create</button>
</form>
</div>
<a href="{% url 'area_dashboard' %}" class="muted" style="display:block; margin-top:16px; text-align:center;">← Back to dashboard</a>
{% endblock %}
