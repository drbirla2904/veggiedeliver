{% extends "base.html" %}
{% block title %}Add Delivery Member{% endblock %}
{% block content %}
<h2 class="section-title">Add a delivery member</h2>
<form method="post">
  {% csrf_token %}
  <label>Name</label>
  <input type="text" name="first_name" required>
  <label>Mobile number</label>
  <input type="tel" name="mobile" maxlength="10" required>
  <button class="btn full" type="submit">Create</button>
</form>
<a href="{% url 'area_dashboard' %}" class="muted" style="display:block; margin-top:14px;">← Back to dashboard</a>
{% endblock %}
